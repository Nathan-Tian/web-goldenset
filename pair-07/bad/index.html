<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dunhuang Murals · A Digital Art Exhibition</title>
<meta name="description" content="An immersive digital exhibition exploring the Dunhuang Murals of the Mogao Caves — a thousand years of Buddhist art, Silk Road stories, and a global mission of preservation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0c0805;
  --cave:#150e08;
  --cave-2:#1e140b;
  --cave-3:#2a1c10;
  --panel:#241710;
  --panel-2:#31200f;
  --line:rgba(214,168,105,.18);
  --line-strong:rgba(214,168,105,.38);
  --sand:#d3a869;
  --ochre:#b98a4e;
  --sand-dim:#9a7a4f;
  --cream:#f2e5cd;
  --ink-text:#efe1c9;
  --text-dim:#c3ac8c;
  --text-faint:#8f7a5e;
  --vermilion:#c24a26;
  --vermilion-deep:#8e2f18;
  --gold:#dfae54;
  --gold-bright:#f0c878;
  --azurite:#3c6f8c;
  --azurite-deep:#274e68;
  --malachite:#3c8a66;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --display:'Cinzel',Georgia,serif;
  --sans:'Jost','Avenur Next','Segue UI',sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --shadow-lg:0 30px 80px rgba(0,0,0,.55);
}
* {margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--ink);
  color:var(--ink-text);
  font-family:var(--sans);
  font-weight:300;
  line-height:1.85;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(194,74,38,.75);color:#fff}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
ul{list-style:none}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1200px;margin:0 auto;padding:0 30px}
.serif{font-family:var(--serif)}
.display{font-family:var(--display)}
.eyebrow{
  display:inline-flex;align-items:center;gap:14px;
  font-family:var(--display);font-size:.72rem;letter-spacing:.42em;
  text-transform:uppercase;color:var(--gold);white-space:nowrap;
}
.eyebrow::before{content:"";width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--gold));flex:none}
.eyebrow.center::after{content:"";width:44px;height:1px;background:linear-gradient(90deg,var(--gold),transparent);flex:none}
h1,h2,h3,h4{font-weight:500}
.sec-pad{padding:130px 0}
.lotus-div{display:flex;align-items:center;justify-content:center;gap:22px;margin:64px 0 0;color:var(--ochre)}
.lotus-div .ln{height:1px;flex:1;max-width:220px;background:linear-gradient(90deg,transparent,var(--line-strong))}
.lotus-div .ln.r{background:linear-gradient(90deg,var(--line-strong),transparent)}
.lotus-div svg{width:34px;height:34px}
#progress{position:fixed;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--vermilion),var(--gold));z-index:200}
.nav{
  position:fixed;top:0;left:0;right:0;z-index:150;
  display:flex;align-items:center;justify-content:space-between;gap:24px;
  padding:0 34px;height:72px;
  background:rgba(12,8,5,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid transparent;transition:border-color .3s,background .3s;
}
.nav.scrolled{border-bottom-color:var(--line);background:rgba(12,8,5,.92)}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:.82rem;letter-spacing:.3em;color:var(--cream);white-space:nowrap}
.brand .mark{width:34px;height:34px;flex:none;color:var(--gold)}
.nav-links{display:flex;gap:2px;list-style:none}
.nav-links a{
  display:block;padding:8px 13px;font-size:.74rem;letter-spacing:.22em;
  text-transform:uppercase;color:var(--text-dim);transition:color .25s;white-space:nowrap;font-weight:400;
}
.nav-links a:hover{color:var(--gold-bright)}
.nav-links a.active{color:var(--gold-bright)}
.nav-links a.active::after{content:"";display:block;height:1px;margin-top:5px;background:linear-gradient(90deg,var(--vermilion),transparent)}
.burger{display:none;flex-direction:column;gap:6px;background:none;border:0;padding:10px}
.burger i{width:26px;height:2px;background:var(--cream);transition:.3s}
.burger.open i:nth-child(1){transform:translateY)8px) rotate(45deg)}
.burger.open i:nth-child(2){opacity:0}
.burger.open i:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
@media(max-width:980px){
  .nav-links{
    position:fixed;top:72px;right:0;bottom:0;width:min(320px,80vw);
    flex-direction:column;gap:0;padding:30px 22px;
    background:rgba(14,9,5,.98);border-left:1px solid var(--line);
    transform:translateX(105%);transition:transform .35s var(--ease);
  }
  .nav-links.open{transform:none}
  .nav-links a{padding:14px 12px;font-size:.92rem;border-bottom:1px solid rgba(214,168,105,.08)}
  .burger{display:flex}
}
.reveal-guid svg,.reveal-guid .plate-info{opacity:0;transition:opacity 1.2s ease 1.2s}
@media(prefers-reduced-motion:reduce){
  *r,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .reveal{opacity:1!important}
  .reveal-guid svg,.reveal-guid .plate-info{opacity:1!important}
  .reveal-guid .guid-track{opacity:0!important}
}
